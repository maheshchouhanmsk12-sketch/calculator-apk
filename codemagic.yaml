workflows:
  android-capacitor-debug-apk:
    name: Android Capacitor Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Verify and configure Java 21 environment
        script: |
          echo "=== Setting and Verifying JDK 21 ==="
          if [ -f /usr/libexec/java_home ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo $JAVA_HOME)
          fi
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          node --version
          npm --version
      - name: Install client dependencies
        script: |
          cd client
          npm ci || npm install
      - name: Build React / Vite frontend
        script: |
          cd client
          npm run build
      - name: Sync Capacitor Android project
        script: |
          cd client
          npx cap sync android
      - name: Build Android Debug APK with Gradle
        script: |
          if [ -f /usr/libexec/java_home ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || echo $JAVA_HOME)
          fi
          echo "Building with JAVA_HOME=$JAVA_HOME"
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace
    artifacts:
      - client/android/app/build/outputs/apk/debug/app-debug.apk
      - client/android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - maheshchouhanmsk12@gmail.com
        notify:
          failure: true
          success: true
